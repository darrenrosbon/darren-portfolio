<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing work — Darren Robson</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/gallery.css?v=4">
</head>
<body>

<header class="g-head">
  <a class="g-back" href="index.html">&larr; Back</a>
  <a class="g-mark" href="index.html" aria-label="Darren Robson — home">
    <img src="img/favicon.svg?v=2" width="28" height="28" alt="">
  </a>
</header>

<main class="g-main">
  <h1 class="g-title">Marketing work</h1>
  <p class="g-sub">Flyers, social posts and brand materials.</p>

  <nav class="g-filters" aria-label="Filter by type">
    <button type="button" class="g-chip active" data-filter="all">All</button>
    <button type="button" class="g-chip" data-filter="flyers">Flyers</button>
    <button type="button" class="g-chip" data-filter="social">Social</button>
    <button type="button" class="g-chip" data-filter="brand">Brand</button>
  </nav>

  <section class="g-group" data-group="flyers">
    <h2 class="g-group-title">Flyers</h2>
    <div class="g-grid g-flyers">
      <figure class="g-piece"><img src="img/marketing/flyer-stonegate-paving-built-to-last.webp" alt="Stonegate Paving flyer: Paving built to last, Wierda Park, Centurion" loading="lazy"><figcaption>Stonegate Paving — Paving built to last</figcaption></figure>
      <figure class="g-piece"><img src="img/marketing/flyer-kruger-lifetime-refinish-warranty.webp" alt="Kruger Body and Paint flyer: Lifetime refinish warranty, est. 1984, Johannesburg" loading="lazy"><figcaption>Kruger Body &amp; Paint — Lifetime refinish warranty</figcaption></figure>
      <div class="g-empty">Coming soon</div>
    </div>
  </section>

  <section class="g-group" data-group="social">
    <h2 class="g-group-title">Social</h2>
    <div class="g-grid g-social">
      <figure class="g-piece"><img src="img/marketing/social-stonegate-paving-built-to-last.webp" alt="Stonegate Paving social post: Paving built to last, get a quote" loading="lazy"><figcaption>Stonegate Paving — Paving built to last</figcaption></figure>
      <figure class="g-piece"><img src="img/marketing/social-chroma-gg-one-tray-icon.webp" alt="Chroma.GG social post: One tray icon, five tools, zero overhead. Buy on Steam" loading="lazy"><figcaption>Chroma.GG — One tray icon, five tools</figcaption></figure>
      <figure class="g-piece"><img src="img/marketing/social-kruger-lifetime-refinish-warranty.webp" alt="Kruger Body and Paint social post: Lifetime refinish warranty, request an estimate" loading="lazy"><figcaption>Kruger Body &amp; Paint — Lifetime refinish warranty</figcaption></figure>
    </div>
  </section>

  <section class="g-group" data-group="brand">
    <h2 class="g-group-title">Brand</h2>
    <div class="g-grid g-brand">
      <figure class="g-piece"><img src="img/marketing/brand-chroma-gg-sheet.webp" alt="Chroma.GG brand identity sheet: logo, colour palette, typography, imagery, mood and voice" loading="lazy"><figcaption>Chroma.GG — Brand identity sheet</figcaption></figure>
      <figure class="g-piece"><img src="img/marketing/brand-talos-sheet.webp" alt="Talos brand identity sheet: logo, colour palette, typography, imagery, mood and voice" loading="lazy"><figcaption>Talos — Brand identity sheet</figcaption></figure>
    </div>
  </section>
</main>

<div class="g-lightbox" id="lightbox" hidden>
  <button type="button" class="g-lightbox-close" aria-label="Close">&times;</button>
  <img id="lightboxImg" alt="">
</div>

<script>
  (function () {
    const chips = document.querySelectorAll('.g-chip');
    const groups = document.querySelectorAll('.g-group');
    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        const f = chip.dataset.filter;
        chips.forEach((c) => c.classList.toggle('active', c === chip));
        groups.forEach((g) => { g.hidden = f !== 'all' && g.dataset.group !== f; });
      });
    });

    // To add a piece: replace a .g-empty tile with
    // <figure class="g-piece"><img src="img/marketing/NAME.jpg" alt="..."><figcaption>Title</figcaption></figure>
    const box = document.getElementById('lightbox');
    const boxImg = document.getElementById('lightboxImg');
    function closeBox() { box.hidden = true; boxImg.removeAttribute('src'); }
    document.addEventListener('click', (e) => {
      const img = e.target.closest('.g-piece img');
      if (img) {
        boxImg.src = img.src;
        boxImg.alt = img.alt;
        box.classList.toggle('tall', img.naturalHeight / img.naturalWidth > 1.45);
        box.scrollTop = 0;
        box.hidden = false;
      } else if (!box.hidden && e.target !== boxImg) {
        closeBox();
      }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !box.hidden) closeBox(); });
  })();
</script>
</body>
</html>
